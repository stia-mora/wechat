services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wechat_local}
      POSTGRES_DB: wechat_source
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wechat -d wechat_source"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wechat:${POSTGRES_PASSWORD:-wechat_local}@db:5432/wechat_source
      SOURCE_API_URL: http://host.docker.internal:5500
    ports:
      - "127.0.0.1:8500:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wechat:${POSTGRES_PASSWORD:-wechat_local}@db:5432/wechat_source
      SOURCE_API_URL: http://host.docker.internal:5500
    depends_on:
      api:
        condition: service_started
  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3500:3000"
    depends_on:
      - api
volumes:
  postgres_data:
