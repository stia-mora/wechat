services:
  source:
    build:
      context: .
      dockerfile: source_bridge/Dockerfile
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 256m
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/source-bridge/upstream-data:/app/ref/wechat-download-api/data
      - ./data/source-bridge/upstream.env:/app/ref/wechat-download-api/.env:ro
      - ./.env:/app/.env:ro
    expose:
      - "5500"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5500/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--limit-concurrency", "32", "--backlog", "64", "--timeout-keep-alive", "2"]
    mem_limit: 256m
    memswap_limit: 384m
    environment:
      SOURCE_API_URL: http://source:5500
      DB_MAX_CONNECTIONS: 6
      DB_ACQUIRE_TIMEOUT_SECONDS: 2
      DB_STATEMENT_TIMEOUT_MS: 15000
    depends_on:
      source:
        condition: service_healthy

  worker:
    restart: unless-stopped
    profiles: [articles]
    mem_limit: 192m
    memswap_limit: 256m
    environment:
      SOURCE_API_URL: http://source:5500

  directory-discovery:
    build: ./backend
    profiles: [directory]
    restart: on-failure
    mem_limit: 128m
    memswap_limit: 192m
    command: python -u -m app.bulk_discover --target 10000 --wait-login
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wechat:${POSTGRES_PASSWORD:-wechat_local}@db:5432/wechat_source
      SOURCE_API_URL: http://source:5500
      CRAWL_INTERVAL_SECONDS: 20
    volumes:
      - ./data/private:/data/private
    depends_on:
      source:
        condition: service_healthy
      db:
        condition: service_healthy

  ai-worker:
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    environment:
      SOURCE_API_URL: http://source:5500
      AI_JOB_START_INTERVAL_SECONDS: 12
    deploy:
      replicas: 5

  web:
    restart: unless-stopped
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 384m
    memswap_limit: 512m

  traffic:
    image: wechat-traffic
    build: ./traffic
    restart: unless-stopped
    env_file: .env.traffic
    environment:
      TRAFFIC_ORIGIN: https://wechat.aim888888.xyz
      TZ: Asia/Shanghai
    volumes:
      - ./data/private/traffic/logs:/logs
      - ./data/private/traffic/state:/data
    mem_limit: 256m
    cpus: 0.35

  gateway:
    image: wechat-traffic-gateway
    build: ./traffic/gateway
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./data/private/traffic/logs:/logs
    mem_limit: 48m
    cpus: 0.25

  db:
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=32", "-c", "work_mem=2MB", "-c", "shared_buffers=128MB", "-c", "maintenance_work_mem=32MB", "-c", "max_parallel_workers_per_gather=0", "-c", "statement_timeout=30s", "-c", "lock_timeout=5s", "-c", "idle_in_transaction_session_timeout=60s", "-c", "jit=off"]
    mem_limit: 384m
    memswap_limit: 512m
