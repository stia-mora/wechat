services:
  source:
    build:
      context: .
      dockerfile: source_bridge/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/source-bridge/upstream-data:/app/ref/wechat-download-api/data
      - ./data/source-bridge/upstream.env:/app/ref/wechat-download-api/.env:ro
      - ./.env:/app/.env:ro
    expose:
      - "5500"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5500/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    restart: unless-stopped
    environment:
      SOURCE_API_URL: http://source:5500
    depends_on:
      source:
        condition: service_healthy

  worker:
    restart: unless-stopped
    profiles: [articles]
    environment:
      SOURCE_API_URL: http://source:5500

  directory-discovery:
    build: ./backend
    profiles: [directory]
    restart: on-failure
    command: python -u -m app.bulk_discover --target 10000 --wait-login
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wechat:${POSTGRES_PASSWORD:-wechat_local}@db:5432/wechat_source
      SOURCE_API_URL: http://source:5500
      CRAWL_INTERVAL_SECONDS: 20
    volumes:
      - ./data/private:/data/private
    depends_on:
      source:
        condition: service_healthy
      db:
        condition: service_healthy

  ai-worker:
    restart: unless-stopped
    environment:
      SOURCE_API_URL: http://source:5500
      AI_JOB_START_INTERVAL_SECONDS: 12
    deploy:
      replicas: 5

  web:
    restart: unless-stopped

  traffic:
    image: wechat-traffic
    build: ./traffic
    restart: unless-stopped
    env_file: .env.traffic
    environment:
      TRAFFIC_ORIGIN: https://wechat.aim888888.xyz
      TZ: Asia/Shanghai
    volumes:
      - ./data/private/traffic/logs:/logs
      - ./data/private/traffic/state:/data
    mem_limit: 256m
    cpus: 0.35

  gateway:
    image: wechat-traffic-gateway
    build: ./traffic/gateway
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./data/private/traffic/logs:/logs
    mem_limit: 48m
    cpus: 0.25

  db:
    restart: unless-stopped
