map $time_iso8601 $log_date { ~^(?<log_day>[0-9-]+) $log_day; }
map $http_referer $safe_referrer {
    default "-";
    ~^https?://(?<ref_host>[^/@:]+)(?::[0-9]+)?(?:/|$) "https://$ref_host/";
}
map $uri $public_path {
    default 1;
    ~^/traffic(?:/|$) 0;
    ~^/api(?:/|$) 0;
    ~^/wechat/(?:admin|api|login|library|wechat-entry-test|_next)(?:/|$) 0;
    ~*\.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|map|txt\.gz)$ 0;
}
map "$http_next_router_prefetch:$http_purpose:$http_sec_purpose:$http_rsc" $navigation_request {
    default 1;
    ~*(?:prefetch|^1:|:1$) 0;
}
map "$public_path:$navigation_request:$http_user_agent" $record_traffic {
    default 0;
    ~*traffic-verify 0;
    ~^1:1: 1;
}
map $realip_remote_addr $trusted_edge {
    default 0;
    172.18.0.1 1;
    127.0.0.1 1;
    ::1 1;
}
map "$trusted_edge:$http_cf_ipcountry" $geo_country {
    default "-";
    ~^1:(?<country_value>[A-Z][A-Z]|T1)$ $country_value;
}
map $trusted_edge $geo_region { default "-"; 1 $http_cf_region; }
map $trusted_edge $geo_city { default "-"; 1 $http_cf_ipcity; }
log_format traffic escape=json '$remote_addr - - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$safe_referrer" "$http_user_agent" '
                   '{"country":"$geo_country","region":"$geo_region","city":"$geo_city"}';
limit_req_zone $binary_remote_addr zone=traffic_events:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=traffic_login:1m rate=1r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # cloudflared runs on the host. Trust its Docker gateway peer, not Internet clients.
    set_real_ip_from 172.18.0.1;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    access_log /logs/access-$log_date.log traffic if=$record_traffic;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Traffic-Country $geo_country;
    proxy_set_header X-Traffic-Region $geo_region;
    proxy_set_header X-Traffic-City $geo_city;
    proxy_buffering off;
    proxy_read_timeout 90s;
    set $web_upstream http://web:3000;
    set $traffic_upstream http://traffic:8000;

    location = /traffic/events {
        client_max_body_size 4k;
        limit_req zone=traffic_events burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $traffic_upstream;
    }
    location = /traffic/login {
        client_max_body_size 4k;
        limit_req zone=traffic_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $traffic_upstream;
    }
    location = /traffic { proxy_pass $traffic_upstream; }
    location /traffic/ { client_max_body_size 4k; proxy_pass $traffic_upstream; }
    location / { proxy_pass $web_upstream; }
}
